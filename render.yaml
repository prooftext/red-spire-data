services:
  - type: web
    name: red-spire-data
    runtime: python
    buildCommand: "poetry install --without dev"
    startCommand: "poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prooftext
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: prooftext
    plan: free