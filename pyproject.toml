[tool.poetry]
name = "red-spire-data"
version = "0.1.0"
description = "Prooftext API - Keystroke biometrics authentication service"
authors = ["Avi Kessner <avi@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "0.27.0"}
psycopg = {extras = ["binary"], version = "^3.1"}
psycopg-pool = "^3.1"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
numpy = "^2.1.0"
pandas = "^2.2.0"
scikit-learn = "^1.5.0"
joblib = "^1.4.0"
pyarrow = "^17.0.0"
torch = "^2.3.1"

[tool.poetry.group.detectors]
optional = true

[tool.poetry.group.detectors.dependencies]
spacy = "^3.7.4"
transformers = "^4.41.2"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.3"
asyncpg = "^0.29.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"