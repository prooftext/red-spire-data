[tool.poetry]
name = "red-spire-data"
version = "0.1.0"
description = "Prooftext API - Keystroke biometrics authentication service"
authors = ["Avi Kessner <avi@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "0.27.0"}
gunicorn = "21.2.0"
asyncpg = "0.29.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.4"
pytest-asyncio = "0.23.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"