<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector Performance - Prooftext</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: #f3f4f6;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .panel {
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 2rem;
        }

        .panel h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #1e3a8a;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #e5e7eb;
        }

        .metric-card h3 {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .metric-card p {
            font-size: 1.2rem;
            font-weight: 600;
            color: #111827;
        }

        .bar-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 160px 1fr 60px;
            align-items: center;
            gap: 1rem;
        }

        .bar-label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .bar-track {
            height: 12px;
            background: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #3b82f6;
            width: 0;
            transition: width 0.6s ease;
        }

        .bar-value {
            font-size: 0.85rem;
            color: #374151;
            text-align: right;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 260px;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .loading {
            padding: 2rem;
            text-align: center;
            color: #6b7280;
        }

        .error {
            padding: 1rem;
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 2rem 0 3rem;
            color: #6b7280;
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .bar-row {
                grid-template-columns: 1fr;
                gap: 0.4rem;
            }

            .bar-value {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Detector Performance</h1>
        <p>Internal comparison dashboard for AI detection baselines</p>
    </header>

    <main>
        <div class="panel" id="summaryPanel">
            <h2>Detector Summary</h2>
            <div class="grid" id="summaryGrid"></div>
        </div>

        <div class="panel">
            <h2>AI Rate by Detector</h2>
            <div class="bar-list" id="barList"></div>
        </div>

        <div class="panel">
            <h2>Average Score (Last 30 Days)</h2>
            <div class="chart-container" id="lineChart"></div>
            <div class="legend" id="legend"></div>
        </div>

        <div id="status" class="loading">Loading performance data...</div>
    </main>

    <footer>
        Prooftext internal metrics
    </footer>

    <script>
        const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ef4444", "#8b5cf6"];

        fetch("/api/v1/keystroke/detector-performance")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                renderSummary(data.per_detector || []);
                renderBars(data.per_detector || []);
                renderLineChart(data.daily || []);
                document.getElementById("status").style.display = "none";
            })
            .catch(err => {
                const status = document.getElementById("status");
                status.className = "error";
                status.textContent = `Failed to load performance data: ${err.message}`;
            });

        function renderSummary(perDetector) {
            const summaryGrid = document.getElementById("summaryGrid");
            summaryGrid.innerHTML = "";

            if (!perDetector.length) {
                summaryGrid.innerHTML = "<p>No detector results yet.</p>";
                return;
            }

            perDetector.forEach((item, index) => {
                const total = item.total || 0;
                const aiCount = item.ai_count || 0;
                const avgScore = item.avg_score !== null ? (item.avg_score * 100).toFixed(1) : "-";
                const aiRate = total ? ((aiCount / total) * 100).toFixed(1) : "0.0";

                const card = document.createElement("div");
                card.className = "metric-card";
                card.innerHTML = `
                    <h3>${escapeHtml(item.detector)}</h3>
                    <p>${total} samples</p>
                    <div style="margin-top: 0.5rem; font-size: 0.85rem; color: #4b5563;">
                        Avg score: ${avgScore}%<br>
                        AI rate: ${aiRate}%
                    </div>
                `;
                summaryGrid.appendChild(card);
            });
        }

        function renderBars(perDetector) {
            const barList = document.getElementById("barList");
            barList.innerHTML = "";

            if (!perDetector.length) {
                barList.innerHTML = "<p>No detector results yet.</p>";
                return;
            }

            perDetector.forEach((item, index) => {
                const total = item.total || 0;
                const aiCount = item.ai_count || 0;
                const aiRate = total ? (aiCount / total) : 0;
                const row = document.createElement("div");
                row.className = "bar-row";
                row.innerHTML = `
                    <div class="bar-label">${escapeHtml(item.detector)}</div>
                    <div class="bar-track"><div class="bar-fill" style="width: ${(aiRate * 100).toFixed(1)}%; background: ${colors[index % colors.length]}"></div></div>
                    <div class="bar-value">${(aiRate * 100).toFixed(1)}%</div>
                `;
                barList.appendChild(row);
            });
        }

        function renderLineChart(daily) {
            const container = document.getElementById("lineChart");
            const legend = document.getElementById("legend");
            container.innerHTML = "";
            legend.innerHTML = "";

            if (!daily.length) {
                container.innerHTML = "<p>No daily data yet.</p>";
                return;
            }

            const detectors = Array.from(new Set(daily.map(item => item.detector)));
            const days = Array.from(new Set(daily.map(item => item.day))).sort();
            const xScale = (index) => (index / Math.max(1, days.length - 1)) * 100;

            const minScore = 0;
            const maxScore = 1;
            const yScale = (value) => 100 - ((value - minScore) / (maxScore - minScore)) * 100;

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");

            detectors.forEach((detector, idx) => {
                const points = [];
                days.forEach((day, dayIndex) => {
                    const entry = daily.find(item => item.detector === detector && item.day === day);
                    if (entry && entry.avg_score !== null) {
                        points.push(`${xScale(dayIndex).toFixed(2)},${yScale(entry.avg_score).toFixed(2)}`);
                    }
                });

                if (points.length) {
                    const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                    polyline.setAttribute("points", points.join(" "));
                    polyline.setAttribute("fill", "none");
                    polyline.setAttribute("stroke", colors[idx % colors.length]);
                    polyline.setAttribute("stroke-width", "0.8");
                    svg.appendChild(polyline);
                }

                const legendItem = document.createElement("div");
                legendItem.className = "legend-item";
                legendItem.innerHTML = `
                    <span class="legend-swatch" style="background: ${colors[idx % colors.length]}"></span>
                    ${escapeHtml(detector)}
                `;
                legend.appendChild(legendItem);
            });

            container.appendChild(svg);
        }

        function escapeHtml(text) {
            const map = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#039;"
            };
            return String(text).replace(/[&<>"']/g, (m) => map[m]);
        }
    </script>
</body>

</html>
