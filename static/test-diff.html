        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Simple diff algorithm - compare character by character using longest common subsequence
        function simpleDiff(text1, text2) {
            const diffs = [];
            
            // Handle empty strings
            if (!text1 && !text2) return diffs;
            if (!text1) {
                diffs.push([1, text2]); // 1 = insert
                return diffs;
            }
            if (!text2) {
                diffs.push([-1, text1]); // -1 = delete
                return diffs;
            }

            // Find common prefix
            let i = 0;
            while (i < text1.length && i < text2.length && text1[i] === text2[i]) {
                i++;
            }
            if (i > 0) {
                diffs.push([0, text1.substring(0, i)]); // 0 = equal
            }

            // Find common suffix
            let j = 1;
            while (j <= text1.length - i && j <= text2.length - i &&
                   text1[text1.length - j] === text2[text2.length - j]) {
                j++;
            }
            j--;

            // Get the different parts
            const text1Mid = text1.substring(i, text1.length - j);
            const text2Mid = text2.substring(i, text2.length - j);

            // Add the differences
            if (text1Mid.length > 0) {
                diffs.push([-1, text1Mid]);
            }
            if (text2Mid.length > 0) {
                diffs.push([1, text2Mid]);
            }

            // Add common suffix
            if (j > 0) {
                diffs.push([0, text1.substring(text1.length - j)]);
            }

            return diffs;
        }

        function generateDiffHTML(submittedText, matchedText) {
            const diffs = simpleDiff(submittedText, matchedText);

            let yourText = '';
            let matchedHTML = '';

            diffs.forEach(([op, data]) => {
                const escapedData = escapeHtml(data);
                if (op === 1) { // INSERT
                    matchedHTML += `<span class="diff-added">${escapedData}</span>`;
                } else if (op === -1) { // DELETE
                    yourText += `<span class="diff-removed">${escapedData}</span>`;
                } else { // EQUAL
                    yourText += escapedData;
                    matchedHTML += escapedData;
                }
            });

            let html = '<div class="diff-container">';
            html += '<div class="diff-box">';
            html += '<h5>Your Submitted Text</h5>';
            html += '<div class="diff-content">';
            html += yourText || '(empty)';
            html += '</div></div>';

            html += '<div class="diff-box">';
            html += '<h5>Matched Document</h5>';
            html += '<div class="diff-content">';
            html += matchedHTML || '(empty)';
            html += '</div></div>';

            html += '</div>';

            return html;
        }

            html += '<div class="category-legend">';
            html += '<div class="legend-item"><div class="legend-color verified"></div><span>✓ Human Verified</span></div>';
            html += '<div class="legend-item"><div class="legend-color pasted"></div><span>📋 Likely Pasted</span></div>';
            html += '<div class="legend-item"><div class="legend-color unknown"></div><span>❓ Unknown</span></div>';
            html += '<div class="legend-item"><div class="legend-color ai"></div><span>⚠️ AI Generated</span></div>';
            html += '</div>';
            html += '<div class="categorized-content">';

            for (let i = 0; i < categorization.length; i++) {
                const item = categorization[i];
                const char = escapeHtml(item.char);
                const category = item.category || 'UNKNOWN';
                const categoryClass = 'category-' + category.toLowerCase().replace(/_/g, '-');
                html += `<span class="${categoryClass}" title="${category}">${char}</span>`;
            }

            html += '</div></div></div>';

            return html;
        }

        function generateTestCase(testCase, index) {
            const html = `
                <div class="test-case">
                    <h2>${index + 1}. ${testCase.name}</h2>
                    <p class="test-description">${testCase.description}</p>
                    ${testCase.categorization ? 
                        generateCategorizedDiffHTML(testCase.matched, testCase.categorization) :
                        generateDiffHTML(testCase.submitted || '', testCase.matched)
                    }
                </div>
            `;
            return html;
        }

        function runAllTests() {
            const resultsDiv = document.getElementById('testResults');
            let html = '';

            testCases.forEach((testCase, index) => {
                html += generateTestCase(testCase, index);
            });

            resultsDiv.innerHTML = html;

            // Scroll to results
            setTimeout(() => {
                resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        function clearAll() {
            document.getElementById('testResults').innerHTML = '';
        }

        // Run tests on page load
        window.addEventListener('load', () => {
            console.log('Diff test suite loaded. Click "Run All Tests" to start.');
        });
    </script>
</body>

</html>
