services:
  - type: web
    name: red-spire-data
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prooftext
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: prooftext
    plan: free