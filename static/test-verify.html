            padding: 2rem;
        }

        header {

        }

        nav a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .test-case {

            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

            padding-bottom: 0.5rem;
            border-bottom: 2px solid #667eea;
        }

        .test-description {
            color: #666;
            margin-bottom: 1.5rem;
            font-style: italic;
        }

        .category-legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
            padding: 1.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid #999;
        }

        .legend-color.verified {
            background-color: #d4edda;
            border-color: #28a745;
        }

        .legend-color.pasted {
            background-color: #f8d7da;
            border-color: #dc3545;
        }

        .legend-color.unknown {
            background-color: #e7e9ec;
            border-color: #6c757d;
        }

        .legend-color.ai {
            background-color: #fff3cd;
            border-color: #ffc107;
        }

        .categorized-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.8;
            padding: 1.5rem;
            background: #f9f9f9;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            border-top: 1px solid #ddd;
            margin-top: 2rem;

        }

                        <p class="test-description">${test.description}</p>
                        <div class="categorized-content">${coloredText}</div>
                    </div>
