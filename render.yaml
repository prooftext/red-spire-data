services:
  - type: web
    name: keystroke-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keystroke-db
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: keystroke-db
    plan: free