services:
  - type: web
    name: red-spire-data
    runtime: python
    buildCommand: "poetry install --no-dev"
    startCommand: "poetry run gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prooftext
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: prooftext
    plan: free